    calcul: [inclus, "Énergie des accélérateurs (TPU) comptée.", *google]
    serveur: [inclus, "CPU et mémoire de l'hôte comptés.", *google]
    inactif: [inclus, "Capacité provisionnée inactive comptée.", *google]
    pue: [inclus, "Surcoût du data center (PUE) compté.", *google]
    eauSite: [inclus, "Eau du refroidissement des data centers comptée.", *google]
    eauElectricite: [exclu, "L'eau consommée pour produire l'électricité n'est pas comptée.", *google]
    fabrication: [non-precise, "Part de la fabrication du matériel non vérifiée dans le chiffre par prompt.", ""]

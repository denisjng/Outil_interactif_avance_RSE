# Chiffres déclarés par les entreprises, par requête, et périmètre de chaque chiffre.
# état : inclus | exclu | non-precise. Un poste que la source ne documente pas reste non-precise.

google:
  acteur: "Google"
  modele: "Gemini (Apps)"
  date: "août 2025"
  perimetre: "Prompt texte médian"
  energieWh: 0.24
  carboneG: 0.03
  eauMl: 0.26
  fmti_colonne: "Google"
  source: &google "https://arxiv.org/abs/2508.15734"
